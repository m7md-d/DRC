name: Desktop packages
on:
  workflow_run:
    workflows: [Checks]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-release
  cancel-in-progress: false
jobs:
  select:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == github.event.repository.default_branch &&
       github.event.workflow_run.event != 'pull_request')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      release: ${{ steps.target.outputs.release }}
      version: ${{ steps.target.outputs.version }}
      tag: ${{ steps.target.outputs.tag }}
      sha: ${{ steps.target.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - id: target
        uses: actions/github-script@v7
        with:
          script: |
            const { checkVersion } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/version.mjs`);
            const { selectRelease } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-release.mjs`);
            const sha = context.payload.workflow_run?.head_sha ?? context.sha;
            const version = checkVersion();
            const result = await selectRelease({ github, context, version, sha });
            core.setOutput('release', String(result.release));
            core.setOutput('version', version);
            core.setOutput('tag', result.tag);
            core.setOutput('sha', sha);
            await core.summary.addHeading(result.release ? `Build ${result.tag}` : 'No new release').addRaw(result.reason).write();
  build:
    needs: select
    if: needs.select.outputs.release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            family: debian
            dockerfile: scripts/linux/Dockerfile
          - runner: ubuntu-24.04-arm
            arch: arm64
            family: debian
            dockerfile: scripts/linux/Dockerfile
          - runner: ubuntu-24.04
            arch: amd64
            family: fedora
            dockerfile: scripts/linux/Dockerfile.fedora
          - runner: ubuntu-24.04-arm
            arch: arm64
            family: fedora
            dockerfile: scripts/linux/Dockerfile.fedora
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
      - name: Build and test ${{ matrix.family }}
        run: docker build --file ${{ matrix.dockerfile }} --target artifacts --output type=local,dest=out .
      - name: Verify clean ${{ matrix.family }} installation
        run: docker build --file ${{ matrix.dockerfile }} --target install-check .
      - name: Verify kernel claims on an owned generated image
        run: |
          sudo modprobe loop
          docker build --file ${{ matrix.dockerfile }} --target kernel-tests --tag drc-kernel-tests .
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m --cap-add SYS_ADMIN --device /dev/loop-control --device-cgroup-rule 'b 7:* rwm' --security-opt apparmor=unconfined drc-kernel-tests > out/linux-kernel-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: DRC-linux-${{ matrix.family }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
  macos:
    needs: select
    if: needs.select.outputs.release == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install smartmontools sleuthkit
      - run: npm ci
      - run: npm test && npm run native:test
      - run: npm run rust:test
      - run: python3 scripts/tests/inherited-source.py src-tauri/binaries/drc-ddrescue-aarch64-apple-darwin
      - run: node scripts/rust.mjs clippy --manifest-path src-tauri/Cargo.toml --features macos-menu-bar --all-targets -- -D warnings
      - run: npm run desktop:build
      - name: Package macOS app
        run: |
          mkdir out
          ditto -c -k --sequesterRsrc --keepParent DRC.app out/DRC-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DRC-macOS-arm64
          path: out/*.zip
          if-no-files-found: error
  release:
    if: needs.select.outputs.release == 'true'
    needs: [select, build, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.select.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/version.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: DRC-*
          path: packages
      - name: Collect packages and checksums
        run: |
          mkdir release
          find packages \( -name '*.deb' -o -name '*.rpm' -o -name '*.zip' \) -exec cp '{}' release/ \;
          for family in debian fedora; do
            for arch in amd64 arm64; do
              cp "packages/DRC-linux-$family-$arch/linux-fault-results.json" "release/linux-fault-results-$family-$arch.json"
              cp "packages/DRC-linux-$family-$arch/linux-kernel-results.json" "release/linux-kernel-results-$family-$arch.json"
            done
          done
          cp scripts/linux/install-debian.sh scripts/linux/install-fedora.sh docs/LINUX-INSTALL.md release/
          cd release
          sha256sum *.deb *.rpm *.zip > SHA256SUMS
      - name: Create release tag after package checks
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.select.outputs.version }}
          RELEASE_SHA: ${{ needs.select.outputs.sha }}
        with:
          script: |
            const { ensureReleaseTag } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/ci-release.mjs`);
            await ensureReleaseTag({ github, repo: context.repo, version: process.env.RELEASE_VERSION, sha: process.env.RELEASE_SHA });
      - name: Upload and publish tag release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.select.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft > release-state; then
            if [ "$(cat release-state)" != true ]; then
              echo "Release is already published."
              exit 0
            fi
            gh release edit "$RELEASE_TAG" --title "DRC $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "DRC $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
          fi
          gh release upload "$RELEASE_TAG" release/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
