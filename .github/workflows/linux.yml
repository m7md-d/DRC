name: Desktop packages
on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run version:check
      - run: npm run readme:check
      - run: npm run copy:check
      - run: npm run public:check
      - run: npm run release:test
  build:
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            family: debian
            dockerfile: scripts/linux/Dockerfile
          - runner: ubuntu-24.04-arm
            arch: arm64
            family: debian
            dockerfile: scripts/linux/Dockerfile
          - runner: ubuntu-24.04
            arch: amd64
            family: fedora
            dockerfile: scripts/linux/Dockerfile.fedora
          - runner: ubuntu-24.04-arm
            arch: arm64
            family: fedora
            dockerfile: scripts/linux/Dockerfile.fedora
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build and test ${{ matrix.family }}
        run: docker build --file ${{ matrix.dockerfile }} --target artifacts --output type=local,dest=out .
      - name: Verify clean ${{ matrix.family }} installation
        run: docker build --file ${{ matrix.dockerfile }} --target install-check .
      - name: Verify kernel claims on an owned generated image
        run: |
          sudo modprobe loop
          docker build --file ${{ matrix.dockerfile }} --target kernel-tests --tag drc-kernel-tests .
          docker run --rm --network none --read-only --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m --cap-add SYS_ADMIN --device /dev/loop-control --device-cgroup-rule 'b 7:* rwm' --security-opt apparmor=unconfined drc-kernel-tests > out/linux-kernel-results.json
      - uses: actions/upload-artifact@v4
        with:
          name: DRC-linux-${{ matrix.family }}-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error
  macos:
    needs: metadata
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - run: brew install ddrescue smartmontools sleuthkit
      - run: npm ci
      - run: npm test && npm run native:test
      - run: npm run rust:test
      - run: node scripts/rust.mjs clippy --manifest-path src-tauri/Cargo.toml --features macos-menu-bar --all-targets -- -D warnings
      - run: npm run desktop:build
      - name: Package macOS app
        run: |
          mkdir out
          ditto -c -k --sequesterRsrc --keepParent DRC.app out/DRC-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: DRC-macOS-arm64
          path: out/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/version.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: DRC-*
          path: packages
      - name: Collect packages and checksums
        run: |
          mkdir release
          find packages \( -name '*.deb' -o -name '*.rpm' -o -name '*.zip' \) -exec cp '{}' release/ \;
          for family in debian fedora; do
            for arch in amd64 arm64; do
              cp "packages/DRC-linux-$family-$arch/linux-fault-results.json" "release/linux-fault-results-$family-$arch.json"
              cp "packages/DRC-linux-$family-$arch/linux-kernel-results.json" "release/linux-kernel-results-$family-$arch.json"
            done
          done
          cp scripts/linux/install-debian.sh scripts/linux/install-fedora.sh docs/LINUX-INSTALL.md release/
          cd release
          sha256sum *.deb *.rpm *.zip > SHA256SUMS
      - name: Upload and publish tag release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --json isDraft --jq .isDraft > release-state; then
            if [ "$(cat release-state)" != true ]; then
              echo "Release is already published."
              exit 0
            fi
            gh release edit "$GITHUB_REF_NAME" --title "DRC $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "DRC $GITHUB_REF_NAME" --notes-file docs/RELEASE-NOTES.md
          fi
          gh release upload "$GITHUB_REF_NAME" release/* --clobber
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
